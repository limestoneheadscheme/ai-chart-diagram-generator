[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-chart-diagram-generator"
version = "0.6.3"
description = "AI-powered chart and diagram generator for Windows desktop — natural language to structured diagrams."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ai-chart-diagram-generator contributors" }]
keywords = ["ai", "charts", "diagrams", "flowchart", "mermaid", "graphviz", "llm", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13.7",
    "watchdog>=4.0",
    "graphviz>=0.20",
    "networkx>=3.3",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.80",
    "transformers>=4.42",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-networkx",
]
csharp = ["pythonnet>=3.0.3"]
java = ["JPype1>=1.5"]

[project.scripts]
acdg = "ai_chart_diagram_generator.bootstrap.cli:main"
acdg-gui = "ai_chart_diagram_generator.bootstrap.desktop:main"

[project.urls]
Homepage = "https://github.com/ai-chart-diagram-generator/ai-chart-diagram-generator"
Issues = "https://github.com/ai-chart-diagram-generator/ai-chart-diagram-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_chart_diagram_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_chart_diagram_generator"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"